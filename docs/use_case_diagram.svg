<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1290" height="55" rx="8" fill="#1e293b"/>
  <text x="50" y="55" fill="#f8fafc" font-size="20" font-weight="700">SkillConnect — UML Use Case Diagram (Version 1.0)</text>
  <text x="1270" y="55" fill="#94a3b8" font-size="14" text-anchor="end">Student Skill Exchange Platform</text>

  <!-- System Boundary -->
  <rect x="220" y="95" width="870" height="840" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="none" filter="url(#shadow)"/>
  <rect x="220" y="95" width="870" height="40" rx="14" fill="#e0f2fe"/>
  <text x="240" y="122" fill="#0369a1" font-size="16" font-weight="700">System Boundary: SkillConnect</text>

  <!-- Module 1: Auth & Profile -->
  <rect x="240" y="150" width="400" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="255" y="172" fill="#166534" font-size="13" font-weight="600">Module 1: Authentication &amp; Profile</text>

  <!-- Module 2: Skill Management -->
  <rect x="240" y="315" width="400" height="195" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.2"/>
  <text x="255" y="337" fill="#854d0e" font-size="13" font-weight="600">Module 2: Skill Management</text>

  <!-- Module 3: Discovery & Matching -->
  <rect x="670" y="150" width="400" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="685" y="172" fill="#1d4ed8" font-size="13" font-weight="600">Module 3: Skill Discovery &amp; Matching</text>

  <!-- Module 4: Exchange & Session -->
  <rect x="670" y="345" width="400" height="270" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <text x="685" y="367" fill="#6b21a8" font-size="13" font-weight="600">Module 4: Skill Exchange &amp; Session</text>

  <!-- Module 5: Rating, Feedback & Dashboard -->
  <rect x="240" y="525" width="400" height="180" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
  <text x="255" y="547" fill="#9f1239" font-size="13" font-weight="600">Module 5: Rating, Feedback &amp; Dashboard</text>

  <!-- Administration Area -->
  <rect x="240" y="720" width="830" height="195" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="255" y="742" fill="#334155" font-size="13" font-weight="600">System Administration &amp; Governance</text>

  <!-- USE CASES (Ovals) -->
  <!-- Auth & Profile -->
  <g id="uc-reg">
    <ellipse cx="340" cy="215" rx="80" ry="22" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="340" y="219" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Register</text>
  </g>
  <g id="uc-login">
    <ellipse cx="525" cy="215" rx="85" ry="22" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="525" y="219" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Log In / Log Out</text>
  </g>
  <g id="uc-profile">
    <ellipse cx="430" cy="268" rx="105" ry="22" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="272" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">View &amp; Update Profile</text>
  </g>

  <!-- Skill Management -->
  <g id="uc-manage-skill">
    <ellipse cx="350" cy="380" rx="90" ry="22" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="350" y="384" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Add / Edit / Remove Skill</text>
  </g>
  <g id="uc-type">
    <ellipse cx="530" cy="380" rx="85" ry="22" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="530" y="384" font-size="11" text-anchor="middle" fill="#0f172a">Set Teach / Learn Type</text>
  </g>
  <g id="uc-prof">
    <ellipse cx="440" cy="455" rx="90" ry="22" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="440" y="459" font-size="11" text-anchor="middle" fill="#0f172a">Set Proficiency Level</text>
  </g>

  <!-- Discovery & Matching -->
  <g id="uc-search">
    <ellipse cx="770" cy="210" rx="85" ry="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="770" y="214" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Search &amp; Filter Students</text>
  </g>
  <g id="uc-peer-prof">
    <ellipse cx="960" cy="210" rx="85" ry="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="960" y="214" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">View Student Profile</text>
  </g>
  <g id="uc-discover">
    <ellipse cx="780" cy="285" rx="95" ry="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="289" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Discover Compatible Partners</text>
  </g>
  <g id="uc-match-score">
    <ellipse cx="970" cy="285" rx="90" ry="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="970" y="284" font-size="11" text-anchor="middle" fill="#0f172a">View Compatibility Score</text>
    <text x="970" y="297" font-size="10" text-anchor="middle" fill="#475569">&amp; Matched Skills</text>
  </g>

  <!-- Exchange & Session -->
  <g id="uc-send-req">
    <ellipse cx="775" cy="405" rx="90" ry="22" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="775" y="409" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Send Exchange Request</text>
  </g>
  <g id="uc-resp-req">
    <ellipse cx="970" cy="405" rx="90" ry="22" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="970" y="409" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Accept / Reject Request</text>
  </g>
  <g id="uc-hist-req">
    <ellipse cx="775" cy="470" rx="90" ry="22" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="775" y="474" font-size="11" text-anchor="middle" fill="#0f172a">View Request History</text>
  </g>
  <g id="uc-sched-sess">
    <ellipse cx="970" cy="470" rx="90" ry="22" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="970" y="474" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Schedule Session</text>
  </g>
  <g id="uc-view-sess">
    <ellipse cx="775" cy="545" rx="85" ry="22" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="775" y="549" font-size="12" text-anchor="middle" fill="#0f172a">View Session Details</text>
  </g>
  <g id="uc-comp-sess">
    <ellipse cx="970" cy="545" rx="95" ry="22" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="970" y="544" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="500">Mark Session Completed</text>
    <text x="970" y="557" font-size="10" text-anchor="middle" fill="#475569">or Cancel Session</text>
  </g>

  <!-- Rating, Feedback & Dashboard -->
  <g id="uc-rate">
    <ellipse cx="350" cy="590" rx="85" ry="22" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="350" y="594" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Rate Completed Exchange</text>
  </g>
  <g id="uc-feedback">
    <ellipse cx="535" cy="590" rx="85" ry="22" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="535" y="594" font-size="12" text-anchor="middle" fill="#0f172a">Submit Written Feedback</text>
  </g>
  <g id="uc-dash">
    <ellipse cx="440" cy="655" rx="105" ry="22" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="440" y="654" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">View Student Dashboard</text>
    <text x="440" y="667" font-size="10" text-anchor="middle" fill="#475569">&amp; Activity Summaries</text>
  </g>

  <!-- Admin Use Cases -->
  <g id="uc-admin-login">
    <ellipse cx="400" cy="785" rx="105" ry="22" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="400" y="789" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Log In with Admin Account</text>
  </g>
  <g id="uc-admin-portal">
    <ellipse cx="650" cy="785" rx="105" ry="22" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="650" y="789" font-size="12" text-anchor="middle" fill="#0f172a" font-weight="500">Access Protected Admin Area</text>
  </g>
  <g id="uc-admin-stats">
    <ellipse cx="500" cy="855" rx="105" ry="22" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="500" y="859" font-size="12" text-anchor="middle" fill="#0f172a">View Basic Platform Statistics</text>
  </g>
  <g id="uc-admin-cats">
    <ellipse cx="780" cy="855" rx="115" ry="22" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="859" font-size="12" text-anchor="middle" fill="#0f172a">Manage Skill Categories &amp; Skills</text>
  </g>

  <!-- ACTORS -->
  <!-- Student Actor (Left) -->
  <g id="actor-student" transform="translate(60, 340)">
    <!-- Stick Figure -->
    <circle cx="40" cy="30" r="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
    <line x1="40" y1="48" x2="40" y2="100" stroke="#4338ca" stroke-width="2.5"/>
    <line x1="15" y1="70" x2="65" y2="70" stroke="#4338ca" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="20" y2="145" stroke="#4338ca" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="60" y2="145" stroke="#4338ca" stroke-width="2.5"/>
    <text x="40" y="172" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">&lt;&lt;Actor&gt;&gt;</text>
    <text x="40" y="192" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle">Student</text>
  </g>

  <!-- Admin Actor (Right) -->
  <g id="actor-admin" transform="translate(1180, 720)">
    <!-- Stick Figure with Shield Icon Badge -->
    <circle cx="40" cy="30" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
    <line x1="40" y1="48" x2="40" y2="100" stroke="#b45309" stroke-width="2.5"/>
    <line x1="15" y1="70" x2="65" y2="70" stroke="#b45309" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="20" y2="145" stroke="#b45309" stroke-width="2.5"/>
    <line x1="40" y1="100" x2="60" y2="145" stroke="#b45309" stroke-width="2.5"/>
    <text x="40" y="172" font-size="15" font-weight="700" fill="#451a03" text-anchor="middle">&lt;&lt;Actor&gt;&gt;</text>
    <text x="40" y="192" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Administrator</text>
  </g>

  <!-- ASSOCIATION LINES: Student to Use Cases -->
  <!-- Student -> Register -->
  <path d="M 120 370 Q 180 230 260 218" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> Login -->
  <path d="M 120 380 Q 200 280 440 225" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> View/Update Profile -->
  <path d="M 125 390 Q 200 320 325 280" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Student -> Add/Edit/Remove Skill -->
  <path d="M 130 410 L 260 388" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Student -> Search & Filter -->
  <path d="M 130 400 Q 300 130 685 210" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> Discover -->
  <path d="M 130 405 Q 350 210 685 285" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Student -> Send Request -->
  <path d="M 130 420 Q 380 370 685 405" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> Accept/Reject Request -->
  <path d="M 130 425 Q 400 420 880 412" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> View History -->
  <path d="M 130 435 Q 380 470 685 470" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> Schedule Session -->
  <path d="M 130 440 Q 400 490 880 475" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> View Session Details -->
  <path d="M 130 450 Q 380 540 690 545" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> Complete/Cancel Session -->
  <path d="M 130 460 Q 400 560 875 550" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Student -> Rate Exchange -->
  <path d="M 125 480 Q 180 560 265 590" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Student -> Dashboard -->
  <path d="M 120 490 Q 160 620 335 655" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- INCLUDE & EXTEND RELATIONSHIPS (Dashed Blue Lines) -->
  <!-- Manage Skill includes Set Type -->
  <path d="M 440 380 L 445 380" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="442" y="372" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Manage Skill includes Set Proficiency -->
  <path d="M 390 402 L 420 433" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="390" y="425" font-size="10" font-weight="600" fill="#0369a1">&lt;&lt;include&gt;&gt;</text>

  <!-- Discover includes View Score -->
  <path d="M 875 285 L 880 285" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="877" y="277" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Schedule Session extends Accept Request -->
  <path d="M 970 448 L 970 427" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="975" y="440" font-size="10" font-weight="600" fill="#0369a1">&lt;&lt;extend&gt;&gt;</text>

  <!-- Rate Exchange includes Feedback -->
  <path d="M 435 590 L 450 590" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="442" y="582" font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Rate Exchange extends Complete Session -->
  <path d="M 435 580 Q 650 510 875 540" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="630" y="535" font-size="10" font-weight="600" fill="#0369a1">&lt;&lt;extend&gt;&gt;</text>

  <!-- ASSOCIATION LINES: Admin to Use Cases -->
  <!-- Admin -> Admin Login -->
  <path d="M 1200 780 Q 900 760 505 785" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Admin -> Admin Portal -->
  <path d="M 1200 790 Q 950 790 755 788" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Admin -> Platform Stats -->
  <path d="M 1200 810 Q 900 850 605 855" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
  <!-- Admin -> Manage Categories -->
  <path d="M 1200 820 Q 1050 860 895 858" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>

</svg>

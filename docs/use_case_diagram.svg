<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 980" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="25" y="15" width="1210" height="52" rx="6" fill="#0f172a"/>
  <text x="45" y="47" fill="#ffffff" font-size="18" font-weight="bold" letter-spacing="0.5">UML USE CASE DIAGRAM — SKILLCONNECT PLATFORM</text>
  <text x="1215" y="47" fill="#94a3b8" font-size="13" text-anchor="end">MCA Semester 1 • Python Mini Project</text>

  <!-- System Boundary Box -->
  <rect x="250" y="85" width="750" height="870" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="85" width="750" height="38" rx="8" fill="#e2e8f0"/>
  <text x="625" y="110" fill="#0f172a" font-size="15" font-weight="bold" text-anchor="middle">System Boundary: SkillConnect System</text>

  <!-- USE CASES (Clean Ovals without UC numbers) -->
  <!-- Module 1: Auth & Profile -->
  <g id="uc-reg">
    <ellipse cx="430" cy="150" rx="110" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="154" font-size="12" text-anchor="middle" fill="#0f172a">Register Account</text>
  </g>
  <g id="uc-login">
    <ellipse cx="780" cy="150" rx="110" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="154" font-size="12" text-anchor="middle" fill="#0f172a">Log In &amp; Log Out</text>
  </g>
  <g id="uc-profile">
    <ellipse cx="605" cy="205" rx="125" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="605" y="209" font-size="12" text-anchor="middle" fill="#0f172a">View &amp; Update Profile</text>
  </g>

  <!-- Module 2: Skill Management -->
  <g id="uc-manage-skills">
    <ellipse cx="430" cy="270" rx="130" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="274" font-size="12" text-anchor="middle" fill="#0f172a">Manage Skills (Add/Edit/Del)</text>
  </g>
  <g id="uc-skill-details">
    <ellipse cx="780" cy="270" rx="130" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="274" font-size="11" text-anchor="middle" fill="#0f172a">Specify Intent &amp; Proficiency</text>
  </g>

  <!-- Module 3: Discovery & Matching -->
  <g id="uc-search">
    <ellipse cx="430" cy="340" rx="120" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="344" font-size="12" text-anchor="middle" fill="#0f172a">Search &amp; Filter Students</text>
  </g>
  <g id="uc-view-profile">
    <ellipse cx="780" cy="340" rx="115" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="344" font-size="12" text-anchor="middle" fill="#0f172a">View Student Profile</text>
  </g>
  <g id="uc-discover">
    <ellipse cx="430" cy="405" rx="130" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="409" font-size="12" text-anchor="middle" fill="#0f172a">Discover Compatible Partners</text>
  </g>
  <g id="uc-match-score">
    <ellipse cx="780" cy="405" rx="130" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="409" font-size="11" text-anchor="middle" fill="#0f172a">Calculate Match Score &amp; Skills</text>
  </g>

  <!-- Module 4: Exchange & Session -->
  <g id="uc-send-req">
    <ellipse cx="430" cy="475" rx="120" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="479" font-size="12" text-anchor="middle" fill="#0f172a">Send Exchange Request</text>
  </g>
  <g id="uc-respond-req">
    <ellipse cx="780" cy="475" rx="125" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="479" font-size="11" text-anchor="middle" fill="#0f172a">Respond to Request (Acc/Rej)</text>
  </g>
  <g id="uc-history">
    <ellipse cx="430" cy="540" rx="120" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="544" font-size="12" text-anchor="middle" fill="#0f172a">View Request History</text>
  </g>
  <g id="uc-schedule">
    <ellipse cx="780" cy="540" rx="120" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="544" font-size="12" text-anchor="middle" fill="#0f172a">Schedule Session</text>
  </g>
  <g id="uc-session-details">
    <ellipse cx="430" cy="605" rx="115" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="609" font-size="12" text-anchor="middle" fill="#0f172a">View Session Details</text>
  </g>
  <g id="uc-complete-session">
    <ellipse cx="780" cy="605" rx="130" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="609" font-size="11" text-anchor="middle" fill="#0f172a">Complete or Cancel Session</text>
  </g>

  <!-- Module 5: Rating & Dashboard -->
  <g id="uc-rate">
    <ellipse cx="430" cy="675" rx="125" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="679" font-size="12" text-anchor="middle" fill="#0f172a">Rate Completed Exchange</text>
  </g>
  <g id="uc-feedback">
    <ellipse cx="780" cy="675" rx="120" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="679" font-size="12" text-anchor="middle" fill="#0f172a">Submit Written Feedback</text>
  </g>
  <g id="uc-dashboard">
    <ellipse cx="605" cy="735" rx="135" ry="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="605" y="739" font-size="12" text-anchor="middle" fill="#0f172a">View Dashboard &amp; Analytics</text>
  </g>

  <!-- Admin Module Divider -->
  <line x1="270" y1="775" x2="980" y2="775" stroke="#94a3b8" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="280" y="795" fill="#475569" font-size="12" font-weight="bold">GOVERNANCE &amp; ADMINISTRATION MODULE</text>

  <g id="uc-admin-login">
    <ellipse cx="430" cy="830" rx="115" ry="20" fill="#ffffff" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="834" font-size="12" text-anchor="middle" fill="#0f172a">Log In as Administrator</text>
  </g>
  <g id="uc-admin-portal">
    <ellipse cx="780" cy="830" rx="120" ry="20" fill="#ffffff" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="834" font-size="12" text-anchor="middle" fill="#0f172a">Access Admin Portal</text>
  </g>
  <g id="uc-admin-stats">
    <ellipse cx="430" cy="895" rx="120" ry="20" fill="#ffffff" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="430" y="899" font-size="12" text-anchor="middle" fill="#0f172a">View Platform Statistics</text>
  </g>
  <g id="uc-manage-cats">
    <ellipse cx="780" cy="895" rx="130" ry="20" fill="#ffffff" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="780" y="899" font-size="11" text-anchor="middle" fill="#0f172a">Manage Categories &amp; Skills</text>
  </g>

  <!-- ACTORS -->
  <!-- Student Actor (Left) -->
  <g id="actor-student" transform="translate(70, 370)">
    <circle cx="50" cy="30" r="20" fill="#e0e7ff" stroke="#312e81" stroke-width="2.5"/>
    <line x1="50" y1="50" x2="50" y2="105" stroke="#312e81" stroke-width="2.5"/>
    <line x1="20" y1="72" x2="80" y2="72" stroke="#312e81" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="25" y2="155" stroke="#312e81" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="75" y2="155" stroke="#312e81" stroke-width="2.5"/>
    <text x="50" y="180" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">&lt;&lt;Primary Actor&gt;&gt;</text>
    <text x="50" y="202" font-size="17" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Student</text>
  </g>

  <!-- Administrator Actor (Right) -->
  <g id="actor-admin" transform="translate(1070, 760)">
    <circle cx="50" cy="30" r="20" fill="#fef3c7" stroke="#78350f" stroke-width="2.5"/>
    <line x1="50" y1="50" x2="50" y2="105" stroke="#78350f" stroke-width="2.5"/>
    <line x1="20" y1="72" x2="80" y2="72" stroke="#78350f" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="25" y2="155" stroke="#78350f" stroke-width="2.5"/>
    <line x1="50" y1="105" x2="75" y2="155" stroke="#78350f" stroke-width="2.5"/>
    <text x="50" y="180" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">&lt;&lt;Secondary Actor&gt;&gt;</text>
    <text x="50" y="202" font-size="17" font-weight="bold" fill="#451a03" text-anchor="middle">Administrator</text>
  </g>

  <!-- STUDENT ASSOCIATIONS -->
  <path d="M 140 410 Q 200 190 320 155" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 420 Q 220 160 670 155" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 430 Q 240 210 480 205" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 440 L 300 275" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 450 L 310 345" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 455 Q 260 340 665 340" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 460 L 300 410" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 470 L 310 475" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 475 Q 280 480 655 480" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 480 L 310 540" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 485 Q 280 545 660 545" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 490 L 315 605" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 495 Q 280 610 650 610" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 500 L 305 675" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 140 510 Q 220 710 470 735" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- INCLUDE & EXTEND RELATIONSHIPS (Dashed Blue Lines) -->
  <!-- Manage Skills includes Specify Intent & Proficiency -->
  <path d="M 560 270 L 650 270" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="605" y="262" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Discover includes Calculate Match Score -->
  <path d="M 560 405 L 650 405" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="605" y="397" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Schedule extends Respond to Request -->
  <path d="M 780 520 L 780 498" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="785" y="512" font-size="10" font-weight="bold" fill="#0284c7">&lt;&lt;extend&gt;&gt;</text>

  <!-- Rate includes Feedback -->
  <path d="M 555 675 L 660 675" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="605" y="667" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Rate extends Complete Session -->
  <path d="M 500 655 Q 590 630 650 620" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dash-arrow)"/>
  <text x="565" y="632" font-size="10" font-weight="bold" fill="#0284c7">&lt;&lt;extend&gt;&gt;</text>

  <!-- ADMIN ASSOCIATIONS -->
  <path d="M 1065 810 Q 820 790 545 825" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 1065 820 L 900 830" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 1065 840 Q 820 870 550 890" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 1065 855 L 910 890" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>

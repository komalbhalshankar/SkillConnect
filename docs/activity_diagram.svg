<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1500" width="100%" height="100%" style="background:#ffffff; font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #94a3b8; }
      .swimlane-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .act-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .act-subtitle { font-size: 10px; font-weight: 400; fill: #64748b; }
      .decision-title { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .decision-sub { font-size: 9px; font-weight: 500; fill: #475569; }
      .guard-green { font-size: 10px; font-weight: 700; fill: #16a34a; }
      .guard-red { font-size: 10px; font-weight: 700; fill: #dc2626; }
      .bar-label { font-size: 10px; font-weight: 700; fill: #0f172a; }
      .end-label { font-size: 10px; font-weight: 700; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="1400" height="56" rx="8" fill="#0f172a"/>
  <text x="55" y="55" class="title">UML ACTIVITY DIAGRAM — SKILLCONNECT PLATFORM</text>
  <text x="1405" y="55" class="subtitle" text-anchor="end">MCA Semester 1 • Skill Exchange Lifecycle with Swimlanes &amp; Concurrency</text>

  <!-- ========================================================= -->
  <!-- SWIMLANES (PARTITIONS) BACKGROUND & HEADERS               -->
  <!-- ========================================================= -->
  <!-- Swimlane 1: Student A (Sender) -->
  <rect x="30" y="94" width="440" height="1380" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="94" width="440" height="40" fill="#0284c7"/>
  <text x="250" y="119" class="swimlane-title" text-anchor="middle">PARTITION: Student A (Initiator / Sender)</text>

  <!-- Swimlane 2: SkillConnect System & DB -->
  <rect x="470" y="94" width="520" height="1380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="470" y="94" width="520" height="40" fill="#1e293b"/>
  <text x="730" y="119" class="swimlane-title" text-anchor="middle">PARTITION: SkillConnect System, Engine &amp; DB</text>

  <!-- Swimlane 3: Student B (Receiver) -->
  <rect x="990" y="94" width="440" height="1380" fill="#fefce8" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="990" y="94" width="440" height="40" fill="#ca8a04"/>
  <text x="1210" y="119" class="swimlane-title" text-anchor="middle">PARTITION: Student B (Recipient / Receiver)</text>

  <!-- ========================================================= -->
  <!-- PHASE 1: DISCOVERY & FORMULATION                          -->
  <!-- ========================================================= -->
  <!-- Start Node -->
  <circle cx="250" cy="170" r="14" fill="#0f172a" filter="url(#shadow)"/>
  <line x1="250" y1="184" x2="250" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Browse & Discover -->
  <rect x="110" y="215" width="280" height="52" rx="26" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="250" y="238" class="act-title" text-anchor="middle">Browse Discover / Search Peers</text>
  <text x="250" y="254" class="act-subtitle" text-anchor="middle">(Views Compatibility Score 0–100%)</text>
  <line x1="250" y1="267" x2="250" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Select Skills & Submit Proposal -->
  <rect x="100" y="305" width="300" height="56" rx="28" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="250" y="330" class="act-title" text-anchor="middle">Formulate &amp; Submit Exchange Proposal</text>
  <text x="250" y="347" class="act-subtitle" text-anchor="middle">Offered: Teach list | Requested: B's Teach list</text>

  <!-- Cross to System: Validation -->
  <path d="M 400 333 L 590 333" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ========================================================= -->
  <!-- PHASE 2: SYSTEM VALIDATION                                -->
  <!-- ========================================================= -->
  <!-- Decision Diamond: Is Valid? -->
  <polygon points="730,300 830,333 730,366 630,333" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="332" class="decision-title" text-anchor="middle">Is Proposal Valid?</text>
  <text x="730" y="346" class="decision-sub" text-anchor="middle">(No duplicates / Not self)</text>

  <!-- Invalid Path (Loop back to Student A) -->
  <path d="M 730 300 L 730 280 L 320 280 L 320 305" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text x="590" y="275" class="guard-red">[No: Display Flash Error]</text>

  <!-- Valid Path (Proceed Down) -->
  <line x1="730" y1="366" x2="730" y2="410" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="390" class="guard-green">[Yes: Valid]</text>

  <!-- Action: Persist Pending Request -->
  <rect x="580" y="410" width="300" height="52" rx="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="433" class="act-title" text-anchor="middle">Save ExchangeRequest</text>
  <text x="730" y="449" class="act-subtitle" text-anchor="middle">(status = 'pending') &amp; Notify Student B</text>

  <!-- Cross to Student B: Notification -->
  <path d="M 880 436 L 1060 436" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========================================================= -->
  <!-- PHASE 3: RECIPIENT EVALUATION & DECISION                  -->
  <!-- ========================================================= -->
  <!-- Action: Student B Reviews -->
  <rect x="1060" y="410" width="300" height="52" rx="26" fill="#ffffff" stroke="#ca8a04" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1210" y="433" class="act-title" text-anchor="middle">View Proposal in Inbox</text>
  <text x="1210" y="449" class="act-subtitle" text-anchor="middle">Inspect Student A Profile &amp; Skills</text>
  <line x1="1210" y1="462" x2="1210" y2="495" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Accept or Reject? -->
  <polygon points="1210,495 1310,530 1210,565 1110,530" fill="#ffffff" stroke="#ca8a04" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1210" y="534" class="decision-title" text-anchor="middle">Accept Proposal?</text>

  <!-- Path: Rejected -->
  <line x1="1310" y1="530" x2="1370" y2="530" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="1318" y="522" class="guard-red">[Reject]</text>

  <rect x="1315" y="560" width="110" height="40" rx="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1370" y="584" class="guard-red" font-size="10" text-anchor="middle">status='rejected'</text>
  <line x1="1370" y1="530" x2="1370" y2="560" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="1370" y1="600" x2="1370" y2="625" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rejected End Node -->
  <circle cx="1370" cy="640" r="14" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="1370" cy="640" r="8" fill="#dc2626"/>
  <text x="1370" y="668" class="end-label" fill="#dc2626" text-anchor="middle">Terminated</text>

  <!-- Path: Accepted (Goes back to System to update status) -->
  <path d="M 1110 530 L 730 530 L 730 570" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="960" y="522" class="guard-green">[Accept: status='accepted']</text>

  <!-- Action: System Updates Request to Accepted -->
  <rect x="580" y="570" width="300" height="52" rx="26" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="593" class="act-title" fill="#16a34a" text-anchor="middle">Update ExchangeRequest status='accepted'</text>
  <text x="730" y="609" class="act-subtitle" text-anchor="middle">Unlocks Session Scheduling for Both Students</text>

  <!-- ========================================================= -->
  <!-- PHASE 4: SESSION SCHEDULING                               -->
  <!-- ========================================================= -->
  <line x1="730" y1="622" x2="730" y2="670" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Participant Fills Schedule Form -->
  <rect x="550" y="670" width="360" height="58" rx="29" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="695" class="act-title" text-anchor="middle">Fill Learning Session Schedule Form</text>
  <text x="730" y="712" class="act-subtitle" text-anchor="middle">Date, Time, Duration (15–300 min), Mode &amp; Meeting Link</text>
  <line x1="730" y1="728" x2="730" y2="765" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Schedule Valid? -->
  <polygon points="730,765 830,798 730,831 630,798" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="797" class="decision-title" text-anchor="middle">Is Schedule Valid?</text>
  <text x="730" y="810" class="decision-sub" text-anchor="middle">(Future date &amp; valid duration)</text>

  <!-- Schedule Invalid Path -->
  <path d="M 630 798 L 520 798 L 520 699 L 550 699" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>
  <text x="440" y="785" class="guard-red">[Invalid Date/Time]</text>

  <!-- Schedule Valid Path -->
  <line x1="730" y1="831" x2="730" y2="875" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="855" class="guard-green">[Valid]</text>

  <!-- Action: Persist Scheduled Session -->
  <rect x="580" y="875" width="300" height="52" rx="26" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="898" class="act-title" text-anchor="middle">Save ExchangeSession</text>
  <text x="730" y="914" class="act-subtitle" text-anchor="middle">(status = 'scheduled') &amp; Send Calendar Alerts</text>

  <!-- ========================================================= -->
  <!-- PHASE 5: EXECUTION & SESSION COMPLETION                   -->
  <!-- ========================================================= -->
  <line x1="730" y1="927" x2="730" y2="970" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Conduct Session (Spans Students) -->
  <rect x="360" y="970" width="740" height="52" rx="26" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="993" class="act-title" fill="#6d28d9" text-anchor="middle">Students A &amp; B Conduct Peer Learning Session</text>
  <text x="730" y="1009" class="act-subtitle" text-anchor="middle">Knowledge exchange via Google Meet / Zoom or In-Person campus lab</text>
  <line x1="730" y1="1022" x2="730" y2="1055" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Complete Session -->
  <rect x="550" y="1055" width="360" height="52" rx="26" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="1078" class="act-title" text-anchor="middle">Participant Clicks 'Mark as Completed'</text>
  <text x="730" y="1094" class="act-subtitle" fill="#16a34a" text-anchor="middle">status = 'completed' (Unlocks Rating Submissions)</text>

  <!-- ========================================================= -->
  <!-- PHASE 6: FORK / JOIN CONCURRENT RATINGS                   -->
  <!-- ========================================================= -->
  <line x1="730" y1="1107" x2="730" y2="1145" stroke="#334155" stroke-width="2"/>

  <!-- FORK BAR -->
  <rect x="220" y="1145" width="1020" height="8" rx="4" fill="#0f172a" filter="url(#shadow)"/>
  <text x="730" y="1140" class="bar-label" text-anchor="middle">&lt;&lt;Fork: Asynchronous Bilateral Evaluation&gt;&gt;</text>

  <!-- Branch Left: Student A Rates B -->
  <line x1="250" y1="1153" x2="250" y2="1185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="100" y="1185" width="300" height="58" rx="29" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="250" y="1210" class="act-title" text-anchor="middle">Student A Rates Student B</text>
  <text x="250" y="1227" class="act-subtitle" text-anchor="middle">Submit 1–5 Stars + Optional Written Feedback</text>

  <!-- Branch Right: Student B Rates A -->
  <line x1="1210" y1="1153" x2="1210" y2="1185" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="1185" width="300" height="58" rx="29" fill="#ffffff" stroke="#ca8a04" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="1210" y="1210" class="act-title" text-anchor="middle">Student B Rates Student A</text>
  <text x="1210" y="1227" class="act-subtitle" text-anchor="middle">Submit 1–5 Stars + Optional Written Feedback</text>

  <!-- Lines down to JOIN BAR -->
  <line x1="250" y1="1243" x2="250" y2="1285" stroke="#334155" stroke-width="2"/>
  <line x1="1210" y1="1243" x2="1210" y2="1285" stroke="#334155" stroke-width="2"/>

  <!-- JOIN BAR -->
  <rect x="220" y="1285" width="1020" height="8" rx="4" fill="#0f172a" filter="url(#shadow)"/>
  <text x="730" y="1280" class="bar-label" text-anchor="middle">&lt;&lt;Join: Rating Synchronization&gt;&gt;</text>

  <!-- Join to Final Processing -->
  <line x1="730" y1="1293" x2="730" y2="1330" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action: Recalculate Ratings & Update Stats -->
  <rect x="530" y="1330" width="400" height="52" rx="26" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="730" y="1353" class="act-title" fill="#15803d" text-anchor="middle">Recalculate Average Ratings &amp; Refresh Stats</text>
  <text x="730" y="1369" class="act-subtitle" text-anchor="middle">Average = Sum(Scores)/N • Update Student Profile Badges</text>
  <line x1="730" y1="1382" x2="730" y2="1420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final Success End Node -->
  <circle cx="730" cy="1438" r="16" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="730" cy="1438" r="10" fill="#16a34a"/>
  <text x="730" y="1468" class="end-label" fill="#15803d" text-anchor="middle">Completed Exchange Lifecycle</text>

</svg>

{% extends "base.html" %}

{% block title %}500 Internal Error — SkillConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="rounded-circle bg-danger bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
    <i class="bi bi-exclamation-octagon text-danger fs-1"></i>
  </div>
  <h1 class="display-5 fw-bold text-dark">500 — Server Error</h1>
  <p class="text-secondary lead mb-4">An unexpected server error occurred. Our team has logged the incident.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
    <i class="bi bi-house-door me-1"></i> Return Home
  </a>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}404 Not Found — SkillConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="rounded-circle bg-warning bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
    <i class="bi bi-question-circle text-warning fs-1"></i>
  </div>
  <h1 class="display-5 fw-bold text-dark">404 — Page Not Found</h1>
  <p class="text-secondary lead mb-4">The page or resource you requested could not be located on SkillConnect.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
    <i class="bi bi-house-door me-1"></i> Return Home
  </a>
</div>
{% endblock %}
